<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Implantacao - Fluxo de Uso do Copiloto RAG</title>
  <desc id="desc">Versao SVG para slides com fluxo Usuario, Cloudflare, Web, API, PostgreSQL, Ollama e Qwen.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #141b2d; }
      .subtitle { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #5a6478; }
      .zone { fill: #fbfcff; stroke: #d8dfeb; stroke-width: 2; rx: 16; ry: 16; }
      .cluster { fill: #ffffff; stroke: #b9c2d4; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; ry: 14; }
      .zone-title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #697389; letter-spacing: 1px; text-transform: uppercase; }

      .node-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #1a1a2e; }
      .node-det { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #6a758b; }
      .tag-text { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: .5px; }

      .cliente { fill: #eff4ff; stroke: #2563eb; stroke-width: 3; rx: 14; ry: 14; }
      .infra { fill: #fff6ee; stroke: #f6821f; stroke-width: 3; rx: 14; ry: 14; }
      .dotnet { fill: #f5f1ff; stroke: #512bd4; stroke-width: 3; rx: 14; ry: 14; }
      .dados { fill: #eef5fa; stroke: #336791; stroke-width: 3; rx: 14; ry: 14; }
      .ia { fill: #fafafa; stroke: #111111; stroke-width: 3; rx: 14; ry: 14; }
      .modelo { fill: #f0f0fb; stroke: #615ced; stroke-width: 3; rx: 14; ry: 14; }

      .tag-cliente { fill: #2563eb; rx: 999; ry: 999; }
      .tag-infra { fill: #f6821f; rx: 999; ry: 999; }
      .tag-dotnet { fill: #512bd4; rx: 999; ry: 999; }
      .tag-dados { fill: #336791; rx: 999; ry: 999; }
      .tag-ia { fill: #111111; rx: 999; ry: 999; }
      .tag-modelo { fill: #615ced; rx: 999; ry: 999; }

      .u-circle { fill: #2563eb; }
      .u-letter { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #ffffff; }

      .conn { stroke: #9aa3b5; stroke-width: 3; fill: none; }
      .conn-dashed { stroke: #9aa3b5; stroke-width: 3; fill: none; stroke-dasharray: 8 8; }
      .conn-label { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #4f596f; }
      .conn-sub { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #818ca2; }

      .legend-title { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #1f2430; }
      .legend-text { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #5f6b80; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3b5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="64" y="78">Diagrama de Implantacao - Fluxo de Uso do Copiloto RAG</text>
  <text class="subtitle" x="64" y="112">Versao SVG para slides: deploy local com Cloudflare opcional, API .NET, PostgreSQL + pgvector em Docker e Ollama local.</text>

  <rect class="zone" x="560" y="210" width="1320" height="430"/>
  <text class="zone-title" x="586" y="242">MAQUINA LOCAL (WINDOWS 11 - I5-14600K - RTX 5060 8 GB)</text>

  <rect class="cluster" x="1188" y="290" width="680" height="280"/>
  <text class="zone-title" x="1212" y="320">DADOS E IA LOCAL (100% LOCAL)</text>

  <!-- Usuario -->
  <rect class="cliente" x="60" y="350" width="210" height="180"/>
  <circle class="u-circle" cx="165" cy="390" r="24"/>
  <text class="u-letter" x="157" y="404">U</text>
  <text class="node-title" x="120" y="442">Usuario</text>
  <text class="node-det" x="82" y="468">Navegador (PC ou celular)</text>
  <rect class="tag-cliente" x="118" y="488" width="94" height="24"/>
  <text class="tag-text" x="132" y="505">CLIENTE</text>

  <!-- Cloudflare -->
  <rect class="infra" x="320" y="350" width="220" height="180"/>
  <text class="node-title" x="354" y="422">Cloudflare</text>
  <text class="node-det" x="344" y="448">DNS + proxy (acesso externo)</text>
  <rect class="tag-infra" x="360" y="488" width="142" height="24"/>
  <text class="tag-text" x="372" y="505">INFRAESTRUTURA</text>

  <!-- Web -->
  <rect class="dotnet" x="600" y="350" width="250" height="180"/>
  <text class="node-title" x="638" y="422">Web Blazor Server</text>
  <text class="node-det" x="642" y="448">.NET 10 - 127.0.0.1:8080</text>
  <rect class="tag-dotnet" x="664" y="488" width="123" height="24"/>
  <text class="tag-text" x="677" y="505">APRESENTACAO</text>

  <!-- API -->
  <rect class="dotnet" x="910" y="350" width="250" height="180"/>
  <text class="node-title" x="933" y="422">API ASP.NET Core</text>
  <text class="node-det" x="952" y="448">.NET 10 - 127.0.0.1:5081</text>
  <rect class="tag-dotnet" x="993" y="488" width="84" height="24"/>
  <text class="tag-text" x="1008" y="505">BACKEND</text>

  <!-- Postgres -->
  <rect class="dados" x="1210" y="350" width="220" height="180"/>
  <text class="node-title" x="1232" y="422">PostgreSQL + pgvector</text>
  <text class="node-det" x="1233" y="448">Docker container - 5432</text>
  <rect class="tag-dados" x="1283" y="488" width="74" height="24"/>
  <text class="tag-text" x="1301" y="505">DADOS</text>

  <!-- Ollama -->
  <rect class="ia" x="1460" y="350" width="190" height="180"/>
  <text class="node-title" x="1514" y="422">Ollama</text>
  <text class="node-det" x="1492" y="448">127.0.0.1:11434</text>
  <rect class="tag-ia" x="1506" y="488" width="99" height="24"/>
  <text class="tag-text" x="1518" y="505">IA LOCAL</text>

  <!-- Modelo -->
  <rect class="modelo" x="1670" y="350" width="190" height="180"/>
  <text class="node-title" x="1705" y="414">Qwen3 8B +</text>
  <text class="node-title" x="1707" y="438">embeddinggemma</text>
  <text class="node-det" x="1686" y="464">empresa-copiloto:v1</text>
  <text class="node-det" x="1711" y="484">8 GB VRAM</text>
  <rect class="tag-modelo" x="1722" y="488" width="85" height="24"/>
  <text class="tag-text" x="1737" y="505">MODELO</text>

  <!-- Conexoes -->
  <line class="conn" x1="270" y1="440" x2="320" y2="440" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="conn-label" x="282" y="414">HTTPS (DNS)</text>
  <text class="conn-sub" x="292" y="432">req / resp</text>

  <line class="conn" x1="540" y1="440" x2="600" y2="440" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="conn-label" x="550" y="414">HTTPS</text>
  <text class="conn-sub" x="544" y="432">requisicao da pagina</text>

  <line class="conn" x1="850" y1="440" x2="910" y2="440" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="conn-label" x="854" y="414">HTTP JSON/NDJSON</text>
  <text class="conn-sub" x="870" y="432">REST + SignalR</text>

  <line class="conn" x1="1160" y1="440" x2="1210" y2="440" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="conn-label" x="1122" y="414">SQL + busca vetorial</text>
  <text class="conn-sub" x="1106" y="432">RAG: recuperacao de contexto</text>

  <path class="conn" d="M 1035 530 C 1180 655, 1400 655, 1555 530" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="conn-label" x="1248" y="690">REST /api/chat</text>
  <text class="conn-sub" x="1238" y="708">NDJSON streaming</text>

  <line class="conn-dashed" x1="1650" y1="440" x2="1670" y2="440" marker-end="url(#arrow)"/>
  <text class="conn-label" x="1600" y="414">modelo carregado</text>

  <!-- Legenda -->
  <line x1="64" y1="770" x2="1856" y2="770" stroke="#e7eaf2" stroke-width="2"/>
  <text class="legend-title" x="64" y="812">Fluxo:</text>
  <text class="legend-text" x="118" y="812">Usuario -> Cloudflare -> Web -> API -> [PostgreSQL + Ollama] -> resposta + fontes.</text>

  <text class="legend-title" x="64" y="844">Deploy:</text>
  <text class="legend-text" x="127" y="844">Web, API e Ollama no host Windows; PostgreSQL em container Docker local.</text>

  <text class="legend-title" x="64" y="876">RAG:</text>
  <text class="legend-text" x="106" y="876">busca vetorial (pgvector) + textual para montar contexto antes da inferencia.</text>

  <text class="legend-title" x="64" y="908">Privacidade:</text>
  <text class="legend-text" x="154" y="908">dados nao saem da maquina; Cloudflare e opcional para acesso externo.</text>
</svg>
